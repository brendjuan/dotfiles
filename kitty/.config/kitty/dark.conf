# glitchcore dark — the normal/default terminal palette.
# Source theme (read-only): the toggle copies this into current-theme.conf and
# pushes it to live windows via `kitty @ set-colors`. Never written through.
foreground            #00ffb4
background            #020008
cursor                #00ffb4
cursor_text_color     #020008
selection_foreground  #020008
selection_background  #ff0050
url_color             #00ffd0

# black
color0  #020008
color8  #3a4a48
# red (classification red)
color1  #ff0050
color9  #ff3374
# green (teal)
color2  #00ffb4
color10 #4dffce
# yellow (amber)
color3  #ff5500
color11 #ffaa55
# blue
color4  #00b4ff
color12 #55c8ff
# magenta
color5  #ff0050
color13 #ff5c94
# cyan
color6  #00ffd0
color14 #5cffe0
# white
color7  #c8fff0
color15 #ffffff

# tab bar: the active tab inverts the teal accent, inactive tabs read as plain
# text. tab_bar_background stays unset — its default follows the background.
active_tab_foreground   #020008
active_tab_background   #00ffb4
inactive_tab_foreground #00ffb4
inactive_tab_background #020008

# split-window borders; kitty defaults to pure green (#00ff00) and light grey.
active_border_color     #00ffb4
inactive_border_color   #3a4a48
bell_border_color       #ff5500

# translucent to match the glitchcore desktop; requires dynamic_background_opacity
# (set in kitty.conf) for live toggling via `kitty @ set-background-opacity`.
background_opacity 0.75
