background_opacity 0.75
dynamic_background_opacity yes
allow_remote_control yes
listen_on unix:/tmp/kitty-{kitty_pid}

# Tab titles. A tab shows the title of its active window. The shell or the
# running program sets that title: kitty's zsh integration sets the current
# directory when the shell is idle and the command line while a command runs;
# programs such as nvim or claude set their own. The template below prefixes
# the title with the name of the current directory ("~" for home), unless the
# title already ends with that directory, which is the idle shell case.
# The template is a Python f-string. `d` is the directory name; the `[:0]`
# slice makes the first field print nothing, it only binds `d`.
tab_title_max_length 30
tab_title_template "{(d := ('~' if re.fullmatch('/home/[^/]+', wd) else wd.rsplit('/', 1)[-1] or '/') if (wd := tab.active_wd) else '')[:0]}{title if not d or re.search('(^|[/:])' + re.escape(d) + '$', title) else d + ': ' + title}"

# State-aware theme, rewritten by the high-contrast toggle
# (~/.config/cwc/scripts/high-contrast.sh). This is a real local file — NOT a
# stow symlink and NOT tracked in git (see .gitignore) — seeded on first boot by
# oneshot.lua from dark.conf. Kept LAST so it overrides the keys above.
# A relative include resolves against this file's directory (~/.config/kitty),
# even though kitty.conf itself is a symlink into the dotfiles repo.
include current-theme.conf
