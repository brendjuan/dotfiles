background_opacity 0.75
dynamic_background_opacity yes
allow_remote_control yes
listen_on unix:/tmp/kitty-{kitty_pid}

# State-aware theme, rewritten by the high-contrast toggle
# (~/.config/cwc/scripts/high-contrast.sh). This is a real local file — NOT a
# stow symlink and NOT tracked in git (see .gitignore) — seeded on first boot by
# oneshot.lua from dark.conf. Kept LAST so it overrides the keys above.
# A relative include resolves against this file's directory (~/.config/kitty),
# even though kitty.conf itself is a symlink into the dotfiles repo.
include current-theme.conf
