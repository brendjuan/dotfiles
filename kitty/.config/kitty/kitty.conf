background_opacity 0.75
dynamic_background_opacity yes
allow_remote_control yes
listen_on unix:/tmp/kitty-{kitty_pid}

# Tab shape and font. Not colors, so `kitty @ set-colors` cannot push these and
# the toggle cannot change them; the tab COLORS live in the theme files.
tab_bar_edge bottom
tab_bar_style fade
# the bar only appears from the second tab on
tab_bar_min_tabs 2
active_tab_font_style bold
inactive_tab_font_style normal
# Claude Code writes a task summary into the terminal title, so {title} names the
# session. {index} matches goto_tab N; {fmt.fg.red} resolves through color1.
tab_title_template "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{index}:{title}"
tab_title_max_length 28

# State-aware theme, rewritten by the high-contrast toggle
# (~/.config/cwc/scripts/high-contrast.sh). This is a real local file — NOT a
# stow symlink and NOT tracked in git (see .gitignore) — seeded on first boot by
# oneshot.lua from dark.conf. Kept LAST so it overrides the keys above.
# A relative include resolves against this file's directory (~/.config/kitty),
# even though kitty.conf itself is a symlink into the dotfiles repo.
include current-theme.conf
