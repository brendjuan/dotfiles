# Portal backend routing for the cwc session (matched via XDG_CURRENT_DESKTOP=cwc,
# which oneshot.lua pushes into the systemd/dbus activation environment).
# Screencast/screenshot must go to xdg-desktop-portal-wlr; everything else
# (file chooser, etc.) falls back to the GTK portal.
[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
